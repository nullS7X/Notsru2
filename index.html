<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Website</title>
    <link rel="stylesheet" href="styles.min.css"> <!-- Minified or combined styles -->
    <style>
        /* Make the iframe take up the whole viewport */
        html, body, iframe {
            height: 100%;
            margin: 0;
            padding: 0;
            border: none;
        }

        iframe {
            width: 1000px;  /* Adjust size to fit content */
            height: 800px;
        }

        /* Disable animations for reduced motion users */
        @media (prefers-reduced-motion: reduce) {
            body {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <!-- Embed the iframe with lazy loading and size adjustments -->
    <iframe src="https://sprunkiretake.app" title="Embedded Website" loading="lazy"></iframe>

    <!-- External JS script -->
    <script src="scripts.min.js" async></script>  <!-- Minified or combined scripts -->
</body>
</html>
